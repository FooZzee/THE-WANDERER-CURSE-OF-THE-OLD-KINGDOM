name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify types and unit tests
        run: |
          npm run lint
          npm test

      - name: Build production bundle
        run: npm run build

      - name: Package Web Distribution ZIP
        run: |
          cd dist
          zip -r ../the-wanderer-web-dist.zip .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" the-wanderer-web-dist.zip --clobber
          else
            gh release create "$TAG_NAME" the-wanderer-web-dist.zip \
              --title "Странник: Проклятие Старого Королевства $TAG_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
